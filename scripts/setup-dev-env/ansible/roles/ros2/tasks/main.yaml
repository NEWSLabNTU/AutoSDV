- name: Install locales package
  become: true
  ansible.builtin.apt:
    name: locales
    update_cache: true

- name: Ensure locale is set
  become: true
  ansible.builtin.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Update locale
  become: true
  ansible.builtin.command: update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
  changed_when: false

- name: Install dependencies for setting up apt sources
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
      - curl
    update_cache: true

- name: Enable universe repository
  become: true
  ansible.builtin.command: add-apt-repository -y universe

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: yes

- name: Get latest release information of ros-apt-source package
  ansible.builtin.uri:
    url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
  register: ros2__ros_apt_source_json
  retries: 3

- name: Set ros-apt-source version
  ansible.builtin.set_fact:
    ros2__ros_apt_source_version: "{{ ros2__ros_apt_source_json.json.tag_name }}"

- name: Save result of 'source /etc/os-release && echo $VERSION_CODENAME'
  ansible.builtin.shell: bash -c 'source /etc/os-release && echo $VERSION_CODENAME'
  register: ros2__ubuntu_codename
  changed_when: false

- name: Download ros2-apt-source package
  ansible.builtin.get_url:
    url: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros2__ros_apt_source_version }}/ros2-apt-source_{{ ros2__ros_apt_source_version }}.{{ ros2__ubuntu_codename.stdout }}_all.deb"
    dest: /tmp/ros2-apt-source.deb
    mode: '0644'

- name: Install ros2-apt-source package
  become: true
  ansible.builtin.apt:
    deb: /tmp/ros2-apt-source.deb
    state: present
    update_cache: true

- name: Hold check of ros-{{ rosdistro + '-' + ros2_installation_type }}
  ansible.builtin.command: apt-mark showhold
  register: held_ros_packages
  changed_when: false

- name: Install ros-{{ rosdistro + '-' + ros2_installation_type }}
  become: true
  ansible.builtin.apt:
    name: ros-{{ rosdistro }}-{{ ros2_installation_type }}
    state: latest
    update_cache: true
  when: "'ros-' + rosdistro + '-' + ros2_installation_type not in held_ros_packages.stdout"
  register: install_result
  failed_when: false

- name: Display warning if ROS 2 package is held
  ansible.builtin.debug:
    msg: ROS package 'ros-{{ rosdistro + '-' + ros2_installation_type }}' is apt-mark hold. Skipping installation.
  when: not install_result.changed

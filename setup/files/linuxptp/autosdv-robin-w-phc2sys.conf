# AutoSDV Robin-W phc2sys configuration.
#
# The service supplies CLOCK_REALTIME as the source and eno1 as the PHC sink.
# This direction is intentional: the Jetson is the PTP grandmaster.

[global]
clock_servo                    linreg
domainNumber                   0
first_step_threshold            0.00002
step_threshold                  0.0
sanity_freq_limit               200000000
uds_address                     /var/run/ptp4l
use_syslog                      0
verbose                         1

# AutoSDV Robin-W PTP grandmaster configuration.
#
# The Jetson system clock is the source of time. phc2sys copies it to the
# eno1 PHC, and ptp4l advertises that PHC to the Robin-W over UDPv4 PTP.
# Keep this file separate from /etc/linuxptp/ptp4l.conf so package upgrades
# cannot change the vehicle's time-sync policy.

[global]

# IEEE 1588 and clock role.
twoStepFlag                    1
slaveOnly                      0
masterOnly                     1
domainNumber                   0
priority1                      127
priority2                      127
clockClass                     248
clockAccuracy                  0xFE
offsetScaledLogVariance        0xFFFF
free_running                   0
timeSource                     0xA0

# Port behavior. Robin-W user-defined PTP uses ordinary UDPv4/E2E PTP.
logAnnounceInterval            1
logSyncInterval                0
operLogSyncInterval            0
logMinDelayReqInterval         0
announceReceiptTimeout         3
syncReceiptTimeout             0
fault_reset_interval           4
asCapable                      auto
BMCA                           ptp

# Local PHC servo and safety limits.
clock_servo                    linreg
first_step_threshold            0.00002
step_threshold                  0.0
max_frequency                   900000000
sanity_freq_limit              200000000

# Transport and hardware timestamping.
transportSpecific              0x0
clock_type                     OC
network_transport              UDPv4
delay_mechanism                E2E
time_stamping                  hardware
tx_timestamp_timeout           20
uds_address                    /var/run/ptp4l

# The systemd unit sends logs to journald, avoiding duplicate syslog output.
use_syslog                     0
verbose                        1

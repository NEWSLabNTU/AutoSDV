/**:
  ros__parameters:
    # Automatically call initialize service on first pose from cuVGL
    auto_initialize: true

    # Initialization method:
    # 0 = AUTO: Use localization algorithm (NDT) to refine the pose
    # 1 = DIRECT: Set pose directly without refinement (recommended for cuVGL)
    initialization_method: 1

    # Allow re-initialization via trigger service after already initialized
    reinitialize_on_trigger: true

    # Timeout for waiting for initialize service (seconds)
    service_timeout_sec: 5.0

    # Input: cuVGL global localization pose
    pose_topic: "/visual_localization/pose"

    # Output: Autoware pose initialization service
    initialize_service: "/localization/initialize"

# AutoSDV 2D-MCL launch defaults (Task 7).
#
# These are the Phase 4 gate parameters -- the configuration that passed
# docs/reports/2dlidar-phase4-init-gating.md's end-to-end check on the
# sample site -- carried over verbatim from
# scripts/2dlidar/run-particle-filter.sh's PF_* env-var defaults as used by
# scripts/2dlidar/run-seed-matrix.sh's "fixed" configuration with
# INITPOSE_SOURCE=gnss. See that report and
# docs/research/localization/2d_mcl_algorithm.md for what each Phase 3e/3c
# knob does.
#
# NOTE: ROS 2 rejects int literals for double-typed parameters -- every
# double below is written with an explicit decimal point.
particle_filter:
  ros__parameters:
    scan_topic: '/scan'
    odometry_topic: '/odom'
    angle_step: 18
    max_particles: 4000
    squash_factor: 3.0
    viz: 1
    max_viz_particles: 60
    range_method: 'cddt'
    theta_discretization: 112
    max_range: 60.0
    fine_timing: 0
    publish_odom: 1
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    sensor_model_variant: 'normalized_short'
    sensor_model_lambda_short: 1.0
    skip_nonfinite_beams: true
    min_finite_beams: 10
    update_on_new_scan_only: true
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.1
    rangelib_variant: 2
    use_ess_gate: false
    ess_threshold_ratio: 0.5
    diag_enable: false
    diag_path: ''
    diag_every: 1
    diag_beam_arrays: false
    diag_topics: false
    likelihood_field_enable: false
    lf_window_m: 40.0
    lf_res_m: 0.5
    lf_period_s: 1.0
    lf_log_floor: 20.0
    random_seed: -1
    init_spread_xy_m: 0.5
    init_spread_theta_rad: 0.4
    # Phase 4 Task 2: gate updates/publication on a real /initialpose seed
    # rather than publishing a map-wide-centroid pose before any seed is
    # known. This is the Phase 4-gated behaviour; the launch file's
    # `require_initialpose` arg can override it.
    require_initialpose: true

# pointcloud_to_laserscan_node -- target_frame:=base_link is the sample-site
# frame fix (see scripts/2dlidar/run-particle-filter.sh's "Frame-fix note"):
# flattening in base_link, not sensor frame, keeps the z-band filter and the
# particle filter's frame-naive sensor model correctly oriented.
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: 'base_link'
    # Sample-site sensor height above base_link (velodyne_top, ~2.0-2.1 m --
    # see sample_sensor_kit_description/config/sensor_kit_calibration.yaml).
    # Parameterised here (launch args), not hardcoded, because the band is
    # sensor-kit specific -- see mcl_localization.launch.xml.
    min_height: 1.91611
    max_height: 2.21611
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0043
    range_min: 0.1
    range_max: 60.0

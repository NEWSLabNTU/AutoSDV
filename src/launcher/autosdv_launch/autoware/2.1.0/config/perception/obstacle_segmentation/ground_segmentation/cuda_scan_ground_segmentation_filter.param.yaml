# autoware_ground_segmentation_cuda 2.1.0's file with AutoSDV's changes marked; loaded by
# autoware/2.1.0/launch/components/autosdv_perception_component.launch.xml under
# ground_segmentation_backend:=cuda. The CUDA node folds the CPU path's crop box and scan
# ground filter into one stage, so it carries both sets of limits.
/**:
  ros__parameters:
    global_slope_max_angle_deg: 10.0
    local_slope_max_angle_deg: 25.0
    # AutoSDV: 0.20 is sized for a full-size car; 0.10 m for 5 cm wheels and 9 cm kerbs
    # (the CPU path's scan_ground_filter.param.yaml uses the same value)
    non_ground_height_threshold: 0.10
    grid_size_m: 0.5
    detection_range_z_max: 3.2
    use_recheck_ground_cluster: true
    recheck_start_distance: 20.0
    use_lowest_point: true
    center_pcl_shift: 0.0
    sector_angle_deg: 1.0
    gnd_cell_buffer_size: 5
    min_x: -100.0
    max_x: 150.0
    min_y: -70.0
    max_y: 70.0
    # AutoSDV: 2.5 m stock. The CPU path crops at vehicle_height + crop_box_margin_max_z,
    # 0.262 + 1.0 m, so an indoor ceiling is not an obstacle; the CUDA node takes a fixed
    # value, so it is written out here. Change it with vehicle_info's vehicle_height.
    max_z: 1.262
    min_z: -2.5

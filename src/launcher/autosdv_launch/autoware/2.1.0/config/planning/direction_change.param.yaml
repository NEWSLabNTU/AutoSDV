# autoware_planning_config 2.1.0's direction_change.param.yaml (behavior_path_planner/
# autoware_behavior_path_direction_change_module/) with AutoSDV's changes marked
# "AutoSDV:". Loaded by autoware/2.1.0/launch/components/autosdv_planning_component.launch.xml
# under use_direction_change_module:=true. Re-diff against upstream after an Autoware upgrade.
/**:
  ros__parameters:
    direction_change:
      # ========================================
      # General parameters
      # ========================================
      print_debug_info: false
      th_arrived_distance: 0.5  # [m] If ego within this distance of route goal, do not activate (align with arrival_check / th_arrived_distance)

      # ========================================
      # Cusp detection parameters
      # Detection of direction change points in path
      # ========================================
      cusp_detection_angle_threshold_deg: 90.0  # [deg] Angle threshold to detect cusp point
      cusp_detection_distance_threshold: 1.2  # [m] Distance threshold to detect approaching cusp
      cusp_detection_distance_start_approaching: 10.0  # [m] Distance to zero terminal velocity at cusp

      # ========================================
      # State transition parameters
      # Vehicle stop detection and state transitions
      # ========================================
      # AutoSDV: 0.5 -> 0.05. The module flips the path's direction once the speed has stayed
      # below this for th_stopped_time. 0.5 m/s is half the car's cruise speed. The hall
      # sensor's slowest reading is one edge (pi * 0.105 m / 12 = 0.0275 m) per its 0.5 s
      # timeout, 0.055 m/s; below that velocity_report publishes 0. So 0.05 means "the
      # velocity report reads zero", the stop the ESC needs before it can arm reverse.
      stop_velocity_threshold: 0.05  # [m/s] Velocity threshold to determine vehicle has stopped
      # AutoSDV: 10.0 -> 1.0. Zero already means 0.5 s without a hall edge; 10 s at each of a
      # three-point turn's two cusps is 20 s parked in the middle of the road.
      th_stopped_time: 1.0  # [s] Duration velocity must stay below stop_velocity_threshold before direction switch at cusp

      # ========================================
      # Goal lateral shift parameters
      # Cubic polynomial blend from centerline to route goal pose
      # ========================================
      enable_goal_lateral_shift: true  # Enable cubic lateral shift toward goal on terminal approach
      max_allowed_yaw_deg: 10.0  # [deg] Max heading change rate for maneuver length (nominal: 20, aggressive: 30)

launch:
  # LiDAR-Only Perception Preset
  # Default preset for AutoSDV
  # Uses only LiDAR for perception, disables camera-based features

  # Perception mode - LiDAR only
  - arg:
      name: perception_mode
      default: "lidar"

  # Feature toggles - Disabled for LiDAR-only mode
  - arg:
      name: use_traffic_light_recognition
      default: "false"

  - arg:
      name: use_detection_by_tracker
      default: "false"

  # The lidar merger, not the multi-channel tracker merger: in lidar mode Autoware's
  # multi-channel tracker reads only the ML detector (CenterPoint), so the clustering's
  # unknown objects reached nothing. CenterPoint is trained on full-size cars' roof lidars
  # and finds nothing from a VLP-16 0.36 m up; a pedestrian-sized box on the route went
  # undetected and the car drove into it (car A's twin, 2026-11-10). Merged, the clusters
  # are tracked as unknown objects.
  - arg:
      name: use_multi_channel_tracker_merger
      default: "false"

  - arg:
      name: use_image_segmentation_based_filter
      default: "false"

  # Map usage
  - arg:
      name: use_pointcloud_map
      default: "true"

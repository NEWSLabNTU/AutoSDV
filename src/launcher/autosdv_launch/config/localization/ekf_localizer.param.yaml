/**:
  ros__parameters:
    node:
      # Enable debug output for fusion tuning
      show_debug_info: true

      # Enable automatic yaw bias estimation for IMU drift correction
      enable_yaw_bias_estimation: true

      # Prediction and TF publishing frequency
      predict_frequency: 50.0  # 50 Hz prediction rate
      tf_rate: 50.0            # 50 Hz TF publishing rate

      # Extended state estimation steps for bias estimation
      extend_state_step: 50

    pose_measurement:
      # Pose measurement configuration
      # The selected pose estimator supplies global pose corrections on
      # /localization/pose_estimator/pose_with_covariance
      pose_additional_delay: 0.0
      pose_measure_uncertainty_time: 0.01

      # Smooth pose corrections over 5 steps to prevent sudden jumps,
      # because a pose estimator can have frame-to-frame jitter
      pose_smoothing_steps: 5

      # Measurement gate - effectively disabled, so the pose estimator is
      # trusted as the global reference
      pose_gate_dist: 10000.0  # Large value to trust pose measurements

    twist_measurement:
      # Twist (velocity) measurement configuration
      # The selected twist estimator provides continuous high-rate velocity
      # tracking; by default gyro_odom, or eagleye with that preset
      twist_additional_delay: 0.0

      # Minimal smoothing for twist (the twist source is already smooth)
      twist_smoothing_steps: 2

      # Measurement gate - effectively disabled, so the twist estimator is trusted
      twist_gate_dist: 10000.0  # Large value to trust twist measurements

    process_noise:
      # Process noise defines system dynamics uncertainty
      # These values determine how much the EKF trusts predictions vs measurements

      # Yaw drift rate (rad/s) - how fast heading can change unexpectedly
      # Lower value = trust predicted heading more
      # Higher value = accept larger heading corrections from measurements
      proc_stddev_yaw_c: 0.005  # Conservative yaw drift

      # Longitudinal velocity change rate (m/s²)
      # This affects how quickly EKF responds to velocity measurements
      # Higher value = faster response to twist updates
      # Lowered from the Autoware default of 10.0
      proc_stddev_vx_c: 5.0  # Moderate velocity dynamics

      # Yaw rate change (rad/s²)
      # Angular acceleration uncertainty
      proc_stddev_wz_c: 1.0  # Conservative angular dynamics (was 5.0)

    simple_1d_filter_parameters:
      # Simple 1D filters for non-observable states (z, roll, pitch)
      # Neither the pose nor the twist estimator measures these directly
      z_filter_proc_dev: 1.0       # Height variation
      roll_filter_proc_dev: 0.1    # Roll angle variation
      pitch_filter_proc_dev: 0.1   # Pitch angle variation

    diagnostics:
      # Diagnostic thresholds for monitoring fusion health

      # Pose update thresholds
      # Warn if no pose update for 50 cycles (1 second at 50Hz)
      # Error if no pose update for 100 cycles (2 seconds)
      pose_no_update_count_threshold_warn: 50
      pose_no_update_count_threshold_error: 100

      # Twist update thresholds
      # These should trigger rarely, as the twist estimator runs continuously
      twist_no_update_count_threshold_warn: 50
      twist_no_update_count_threshold_error: 100

      # Error ellipse visualization parameters
      ellipse_scale: 3.0  # 3-sigma ellipse for visualization
      error_ellipse_size: 1.5  # Error threshold (meters)
      warn_ellipse_size: 1.2   # Warning threshold (meters)
      error_ellipse_size_lateral_direction: 0.3  # Lateral error threshold
      warn_ellipse_size_lateral_direction: 0.25  # Lateral warning threshold

    misc:
      # Miscellaneous configuration

      # Velocity threshold for treating vehicle as stationary (m/s)
      # Set to 0.0 to always use velocity measurements
      threshold_observable_velocity_mps: 0.0

      # Reference frame for pose measurements
      # The pose estimator publishes in the "map" frame (global coordinates)
      pose_frame_id: "map"

# Configuration Notes:
# ====================
# The EKF fuses two inputs, each identified by topic rather than by which
# estimator happens to be selected:
#
# - Pose estimator: global pose corrections
#   Topic: /localization/pose_estimator/pose_with_covariance
#   Source: whichever pose_source is launched (cuda_ndt, ndt, mcl)
#   Purpose: periodic global reference to prevent drift accumulation
#
# - Twist estimator: local velocity tracking (continuous, high rate)
#   Topic: /localization/twist_estimator/twist_with_covariance
#   Source: gyro_odom by default, or eagleye with that localization preset
#   Purpose: smooth odometry between pose corrections
#
# Provenance: these values were tuned for an AR tag + Isaac visual SLAM
# experiment that is no longer part of the project, which is why several of
# them depart from the Autoware defaults (proc_stddev_vx_c 5.0 against 10.0,
# proc_stddev_wz_c 1.0 against 5.0, and both measurement gates opened to
# 10000.0). They have not been re-tuned against the NDT pose and gyro_odom
# twist that actually run now. Treat them as inherited, not validated.
#
# Tuning Guidelines:
# - Increase proc_stddev_vx_c for faster response to velocity changes
# - Increase pose_smoothing_steps if pose corrections cause jerky motion
# - Adjust measurement gates if valid measurements are being rejected
# - Monitor diagnostics topics for fusion health (/diagnostics)
#
# Expected Behavior:
# - Smooth tracking while the pose estimator is converged
# - Gradual drift accumulation if pose updates stop (velocity-only integration)
# - Quick re-convergence when pose updates resume

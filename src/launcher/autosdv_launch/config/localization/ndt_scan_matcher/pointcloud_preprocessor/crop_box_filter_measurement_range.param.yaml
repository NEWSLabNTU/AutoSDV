/**:
  ros__parameters:
    input_frame: "base_link"
    output_frame: "base_link"
    # AutoSDV: crop box limits the matching area around the vehicle.
    #
    # Measured on the COSS map, replaying outdoor_20251226_153115 at
    # ndt.resolution 2.0 (per-frame position scatter / yaw p95 / mean
    # initial-to-result distance):
    #   +/-20 m  0.020 m  1.12 deg  0.154 m
    #   +/-40 m  0.012 m  1.07 deg  0.129 m   <- here
    #   +/-60 m  0.014 m  1.18 deg  0.131 m
    # 40 m wins on all three: far returns lengthen the lever arm that
    # constrains yaw, and the map's ground agrees with the scan out to 40 m.
    # Do not push past 60 m on this map -- only 18% of returns beyond 60 m
    # land on any mapped cell.
    #
    # This was previously 20 m because widening it used to break NDT. That was
    # real but was caused by ndt.resolution 4.0, not by the range; see
    # docs/reports/cuda-ndt-coss-replay.md.
    min_x: -40.0
    max_x: 40.0
    min_y: -40.0
    max_y: 40.0
    # AutoSDV: Z-axis filtering based on LiDAR mount height
    # Negative values include ground points
    # Positive values filter ground, focusing on vertical structures
    min_z: -1.0
    max_z: 50.0
    negative: False
    processing_time_threshold_sec: 0.01

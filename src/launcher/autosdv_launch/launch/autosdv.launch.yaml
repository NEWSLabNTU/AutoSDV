launch:
- arg:
    name: is_simulation
    default: "false"
    description: "Enable simulation mode (disables PWM output to hardware)"

# Sensor Suite Configuration
- arg:
    name: sensor_suite
    default: "vlp32c_zed"
    description: "Predefined sensor suite: robin_zed, robin_zed_mpu, vlp32c_zed, vlp32c_zed_mpu, cube1_usb, custom"

# Individual Sensor Parameters (override suite defaults when sensor_suite=custom)
- arg:
    name: lidar_model
    default: ""
    description: "LiDAR model (cube1, robin-w, or vlp32c) - empty string uses suite default"

- arg:
    name: camera_model
    default: ""
    description: "Camera model (zedxm, usb, or none) - empty string uses suite default"

- arg:
    name: imu_source
    default: ""
    description: "IMU source (mpu9250, zed) - empty string uses suite default"

- arg:
    name: gnss_receiver
    default: ""
    description: "GNSS receiver type (ublox, septentrio, or garmin) - empty string uses suite default"

- arg:
    name: use_gnss
    default: ""
    description: "Enable GNSS for outdoor operation - empty string uses suite default"

- arg:
    name: use_ntrip
    default: "true"
    description: "Enable NTRIP client for RTK corrections (ublox only)"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

- arg:
    name: pose_source
    default: "ndt"
    description: "Pose estimation source: ndt (LiDAR NDT), isaac (Visual SLAM)"

- arg:
    name: enable_zed_object_detection
    default: ""
    description: "Enable ZED camera object detection - empty string uses suite default"

# Launch Isaac ROS Visual SLAM when pose_source is isaac
- group:
    if: "$(eval '\"$(var pose_source)\" == \"isaac\"')"
    children:
    - include:
        file: "$(find-pkg-share autosdv_isaac_slam_launch)/launch/isaac_slam_with_zed.launch.xml"
        arg:
        - name: camera_namespace
          value: /sensing/camera/$(var camera_model)/$(var camera_model)
        - name: enable_imu_fusion
          value: "true"
        - name: enable_visualization
          value: "true"

- include:
    file: "$(find-pkg-share autoware_launch)/launch/autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: autosdv_vehicle
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: autosdv_sensor_kit
    -
      name: map_path
      value: ./data/COSS-map-planning
    -
      name: data_path
      value: ./data
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: "false"
    -
      name: launch_planning
      value: "true"
    -
      name: launch_control
      value: "true"
    -
      name: perception_mode
      value: "lidar"  # LiDAR-only mode
    -
      name: use_traffic_light_recognition
      value: "false"  # Disable traffic light recognition
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: "false"  # Disable detection by tracker to simplify
    -
      name: use_image_segmentation_based_filter
      value: "false"  # Disable image-based filters
    -
      name: use_pointcloud_map
      value: "true"  # Disable pointcloud map for now
    -
      name: use_sim_time
      value: "false"
    -
      name: rviz_config
      value: "$(find-pkg-share autosdv_launch)/rviz/autosdv.rviz"
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: twist_source
      value: gyro_odom  # gyro_odom, eagleye
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: camera_model
      value: $(var camera_model)
    -
      name: imu_source
      value: $(var imu_source)
    -
      name: gnss_receiver
      value: $(var gnss_receiver)
    -
      name: use_gnss
      value: $(var use_gnss)
    -
      name: use_ntrip
      value: $(var use_ntrip)
    -
      name: enable_zed_object_detection
      value: $(var enable_zed_object_detection)
    -
      name: sensor_suite
      value: $(var sensor_suite)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)

# System Monitor
- include:
    file: "$(find-pkg-share autosdv_system_monitor)/launch/autosdv_system_monitor.launch.yaml"

# RQT Runtime Monitor
- node:
    pkg: rqt_runtime_monitor
    exec: rqt_runtime_monitor
    name: rqt_runtime_monitor

# Static Transform Publisher for Mapless/Indoor Operation
# Provides map -> base_link transform for indoor operation without localization
- node:
    pkg: tf2_ros
    exec: static_transform_publisher
    name: map_to_base_link_static_tf
    args: "0 0 0 0 0 0 1 map base_link"

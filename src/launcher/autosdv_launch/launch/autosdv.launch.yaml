launch:
- arg:
    name: is_simulation
    default: "false"
    description: "Enable simulation mode (disables PWM output to hardware)"

- arg:
    name: lidar_model
    default: "robin-w"
    description: "LiDAR model (cube1, robin-w, or vlp32c)"

- arg:
    name: camera_model
    default: "zedxm"
    description: "Camera model (zedxm, usb, or none)"

- arg:
    name: gnss_receiver
    default: "garmin"
    description: "GNSS receiver type (ublox, septentrio, or garmin)"

- arg:
    name: use_gnss
    default: "false"
    description: "Enable GNSS for outdoor operation (disable for indoor/Docker testing)"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

- arg:
    name: pose_source
    default: "ndt"
    description: "Pose estimation source: ndt (LiDAR NDT), isaac (Visual SLAM)"

- arg:
    name: enable_zed_object_detection
    default: "true"
    description: "Enable ZED camera object detection and conversion to Autoware format"

- arg:
    name: launch_rviz
    default: "true"
    description: "Launch RViz visualization (disable for headless/Docker operation)"

- arg:
    name: launch_perception
    default: "false"
    description: "Launch perception modules (requires GPU/TensorRT - disable for Docker/x86)"

- arg:
    name: launch_vehicle
    default: "false"
    description: "Launch vehicle interface (requires Jetson.GPIO - disable for Docker/x86)"

- arg:
    name: launch_sensing_driver
    default: "false"
    description: "Launch sensor drivers (requires real hardware - disable for Docker/x86)"

# Launch Isaac ROS Visual SLAM when pose_source is isaac
- group:
    if: "$(eval '\"$(var pose_source)\" == \"isaac\"')"
    children:
    - include:
        file: "$(find-pkg-share autosdv_isaac_slam_launch)/launch/isaac_slam_with_zed.launch.xml"
        arg:
        - name: camera_namespace
          value: /sensing/camera/$(var camera_model)/zed_node
        - name: enable_imu_fusion
          value: "true"
        - name: enable_visualization
          value: "true"

- include:
    file: "$(find-pkg-share autoware_launch)/launch/autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: autosdv_vehicle
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: autosdv_sensor_kit
    -
      name: map_path
      value: ./data/COSS-map-planning
    -
      name: data_path
      value: ./data
    -
      name: launch_vehicle
      value: $(var launch_vehicle)  # Use argument value
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: $(var launch_sensing_driver)  # Use argument value
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: $(var launch_perception)  # Use argument value
    -
      name: launch_planning
      value: "false"
    -
      name: launch_control
      value: "true"
    -
      name: perception_mode
      value: "lidar"  # LiDAR-only mode
    -
      name: use_traffic_light_recognition
      value: "false"  # Disable traffic light recognition
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: "false"  # Disable detection by tracker to simplify
    -
      name: use_image_segmentation_based_filter
      value: "false"  # Disable image-based filters
    -
      name: use_pointcloud_map
      value: "false"  # Disable pointcloud map for now
    -
      name: use_sim_time
      value: "false"
    -
      name: rviz
      value: $(var launch_rviz)
    -
      name: rviz_config
      value: "$(find-pkg-share autosdv_launch)/rviz/autosdv.rviz"
    -
      name: launch_rviz
      value: $(var launch_rviz)
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: twist_source
      value: gyro_odom  # gyro_odom, eagleye
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)
    -
      name: enable_zed_object_detection
      value: $(var enable_zed_object_detection)
    -
      name: use_gnss
      value: $(var use_gnss)
    # Note: camera_model parameter is passed through autosdv_sensor_kit parameter configuration
    
# System Monitor (requires Jetson.GPIO - only launch with real hardware)
- group:
    if: "$(var launch_vehicle)"
    children:
    - include:
        file: "$(find-pkg-share autosdv_system_monitor)/launch/autosdv_system_monitor.launch.yaml"

# RQT Runtime Monitor (GUI application - only launch when RViz is enabled)
- group:
    if: "$(var launch_rviz)"
    children:
    - node:
        pkg: rqt_runtime_monitor
        exec: rqt_runtime_monitor
        name: rqt_runtime_monitor

# Static Transform Publisher for Mapless/Indoor Operation
# Provides map -> base_link transform for indoor operation without localization
- node:
    pkg: tf2_ros
    exec: static_transform_publisher
    name: map_to_base_link_static_tf
    args: "0 0 0 0 0 0 1 map base_link"

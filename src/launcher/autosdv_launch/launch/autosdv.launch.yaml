launch:
- arg:
    name: is_simulation
    default: "false"
    description: "Enable simulation mode (disables PWM output to hardware)"

- arg:
    name: lidar_model
    default: "robin-w"
    description: "LiDAR model (cube1, robin-w, or vlp32c)"

- arg:
    name: camera_model
    default: "zedxm"
    description: "Camera model (zedxm, usb, or none)"

- arg:
    name: gnss_receiver
    default: "garmin"
    description: "GNSS receiver type (ublox, septentrio, or garmin)"

- arg:
    name: use_gnss
    default: "true"
    description: "Enable GNSS for outdoor operation (disable for indoor testing)"

- include:
    file: "$(find-pkg-share autoware_launch)/launch/autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: autosdv_vehicle
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: autosdv_sensor_kit
    -
      name: map_path
      value: ./data/COSS-map-planning
    -
      name: data_path
      value: ./data
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: "true"
    -
      name: launch_planning
      value: "false"
    -
      name: launch_control
      value: "true"
    -
      name: perception_mode
      value: "lidar"  # LiDAR-only mode
    -
      name: use_traffic_light_recognition
      value: "false"  # Disable traffic light recognition
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: "false"  # Disable detection by tracker to simplify
    -
      name: use_image_segmentation_based_filter
      value: "false"  # Disable image-based filters
    -
      name: use_pointcloud_map
      value: "false"  # Disable pointcloud map for now
    -
      name: use_sim_time
      value: "false"
    -
      name: pose_source
      value: ndt
    -
      name: twist_source
      value: gyro_odom  # gyro_odom, eagleye
    -
      name: lidar_model
      value: $(var lidar_model)
    # Note: camera_model parameter is passed through autosdv_sensor_kit parameter configuration

# System Monitor
- include:
    file: "$(find-pkg-share autosdv_system_monitor)/launch/autosdv_system_monitor.launch.yaml"

# RQT Runtime Monitor
- node:
    pkg: rqt_runtime_monitor
    exec: rqt_runtime_monitor
    name: rqt_runtime_monitor

launch:
- arg:
    name: is_simulation
    default: "false"
    description: "Enable simulation mode (disables PWM output to hardware)"

# AutoSDV: map_path was hardcoded to ./data/COSS-map-planning below (not an
# overridable arg) -- see logging_simulation.launch.yaml for the same fix
# and rationale. Default unchanged.
- arg:
    name: map_path
    default: "./data/COSS-map-planning"
    description: "Map directory path, forwarded to autosdv_map_component (Task 1); must contain occupancy_grid.yaml for pose_source:=mcl"

# AutoSDV: occupancy_grid_file was not forwarded from this top-level launch
# either -- see logging_simulation.launch.yaml for the same fix and the
# Task 8 rationale.
- arg:
    name: occupancy_grid_file
    default: "occupancy_grid.yaml"
    description: "2-D occupancy grid metadata file name within map_path (pose_source:=mcl only)"

# Sensor Suite Configuration
- arg:
    name: sensor_suite
    default: "vlp32c_zed_imu"
    description: "Predefined sensor suite: robin_zed, robin_zed_mpu, vlp32c_zed, vlp32c_zed_mpu, vlp32c_zed_imu, cube1_usb, custom"

# Individual Sensor Parameters (override suite defaults when sensor_suite=custom)
- arg:
    name: lidar_model
    default: ""
    description: "LiDAR model (cube1, robin-w, or vlp32c) - empty string uses suite default"

- arg:
    name: camera_model
    default: ""
    description: "Camera model (zedxm, usb, or none) - empty string uses suite default"

- arg:
    name: imu_source
    default: ""
    description: "IMU source (mpu9250, zed) - empty string uses suite default"

- arg:
    name: gnss_receiver
    default: ""
    description: "GNSS receiver type (ublox, septentrio, or garmin) - empty string uses suite default"

- arg:
    name: use_gnss
    default: ""
    description: "Enable GNSS for outdoor operation - empty string uses suite default"

- arg:
    name: use_ntrip
    default: "true"
    description: "Enable NTRIP client for RTK corrections (ublox only)"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

- arg:
    name: pose_source
    default: "cuda_ndt"
    description: "Pose estimation source: cuda_ndt (default, CUDA NDT), ndt (built-in Autoware CPU NDT), isaac, visual"

- arg:
    name: pose_source_package
    default: "auto"
    description: "Package providing launch/pose_estimator.launch.xml. 'auto' derives it from pose_source (cuda_ndt -> cuda_ndt_matcher_launch, anything else -> built-in Autoware NDT). Set explicitly only to plug in a third-party estimator; use pose_source:=ndt for built-in NDT (ros2 launch rejects an empty value)"

# Resolve 'auto' into a concrete package name. Without this, pose_source_package
# defaulted to cuda_ndt_matcher_launch regardless of pose_source, and because the
# selector in pose_twist_estimator.launch.xml splits pose_source on underscores
# ('cuda_ndt' -> {'cuda','ndt'}), pose_source:=ndt silently ran the CUDA plugin
# too -- contradicting its documented "built-in Autoware NDT" meaning.
- let:
    name: resolved_pose_source_package
    value: "$(eval \"('cuda_ndt_matcher_launch' if '$(var pose_source)' == 'cuda_ndt' else '') if '$(var pose_source_package)' == 'auto' else '$(var pose_source_package)'\")"

- arg:
    name: visual_map_dir
    default: ""
    description: "Path to visual map directory for pose_source:=visual (contains cuvgl_map/, cuvslam_map/)"

- arg:
    name: enable_zed_object_detection
    default: ""
    description: "Enable ZED camera object detection - empty string uses suite default"

- arg:
    name: launch_perception
    default: "true"
    description: "Launch perception module (object detection). When false, empty objects are published."

# Preset Configuration
- arg:
    name: perception_preset
    default: "lidar_only"
    description: "Perception preset: lidar_only, camera_lidar_fusion, minimal"

- arg:
    name: localization_preset
    default: "default"
    description: "Localization preset: default, eagleye"

# Include perception preset (defines perception_mode, use_traffic_light_recognition, etc.)
- include:
    file: "$(find-pkg-share autosdv_launch)/config/perception/preset/$(var perception_preset)_preset.yaml"

# Include localization preset (defines twist_source)
- include:
    file: "$(find-pkg-share autosdv_launch)/config/localization/preset/$(var localization_preset)_preset.yaml"

# Launch Isaac ROS Visual SLAM when pose_source is isaac
- group:
    if: "$(eval '\"$(var pose_source)\" == \"isaac\"')"
    children:
    - include:
        file: "$(find-pkg-share autoware_isaac_localization_launch)/launch/isaac_slam.launch.py"
        arg:
        - name: camera_namespace
          value: /sensing/camera/$(var camera_model)/$(var camera_model)
        - name: enable_imu_fusion
          value: "true"
        - name: enable_visualization
          value: "true"

# Launch Visual Global Localization (cuVGL + cuVSLAM) when pose_source is visual
# This provides camera-only localization without LiDAR NDT
- group:
    if: "$(eval '\"$(var pose_source)\" == \"visual\"')"
    children:
    - include:
        file: "$(find-pkg-share autoware_isaac_localization_launch)/launch/visual_localization.launch.xml"
        arg:
        - name: map_dir
          value: $(var visual_map_dir)
        - name: camera_namespace
          value: /sensing/camera/$(var camera_model)/$(var camera_model)
        - name: camera_model
          value: $(var camera_model)
        - name: enable_global_localization
          value: "true"
        - name: enable_visual_slam
          value: "true"
        - name: enable_pose_initializer
          value: "true"
        - name: enable_imu_fusion
          value: "true"
        - name: auto_initialize
          value: "true"

- include:
    file: "$(find-pkg-share autosdv_launch)/launch/autosdv_autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: autosdv_vehicle
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: autosdv_sensor_kit
    -
      name: map_path
      value: $(var map_path)
    -
      name: occupancy_grid_file
      value: $(var occupancy_grid_file)
    -
      name: data_path
      value: /opt/autoware/1.5.0/data
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: $(var launch_perception)
    -
      name: launch_planning
      value: "true"
    -
      name: launch_control
      value: "true"
    -
      name: perception_mode
      value: $(var perception_mode)
    -
      name: use_traffic_light_recognition
      value: $(var use_traffic_light_recognition)
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: $(var use_detection_by_tracker)
    -
      name: use_image_segmentation_based_filter
      value: $(var use_image_segmentation_based_filter)
    -
      name: use_pointcloud_map
      value: $(var use_pointcloud_map)
    -
      name: use_sim_time
      value: "false"
    -
      name: rviz_config
      value: "$(find-pkg-share autosdv_launch)/rviz/autosdv.rviz"
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: pose_source_package
      value: $(var resolved_pose_source_package)
    -
      name: twist_source
      value: $(var twist_source)
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: camera_model
      value: $(var camera_model)
    -
      name: imu_source
      value: $(var imu_source)
    -
      name: gnss_receiver
      value: $(var gnss_receiver)
    -
      name: use_gnss
      value: $(var use_gnss)
    -
      name: use_ntrip
      value: $(var use_ntrip)
    -
      name: enable_zed_object_detection
      value: $(var enable_zed_object_detection)
    -
      name: sensor_suite
      value: $(var sensor_suite)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)

# Publish empty objects when perception is disabled
# This unblocks behavior_path_planner which waits for /perception/object_recognition/objects
- group:
    unless: $(var launch_perception)
    children:
    - node:
        pkg: dummy_perception_publisher
        exec: empty_objects_publisher
        name: empty_objects_publisher
        namespace: perception/object_recognition
        remap:
        - from: ~/output/objects
          to: /perception/object_recognition/objects

# System Monitor
- include:
    file: "$(find-pkg-share autosdv_system_monitor)/launch/autosdv_system_monitor.launch.yaml"


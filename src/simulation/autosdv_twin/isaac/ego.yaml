# Car A in Isaac Sim: aib's ego config (scenario-world-bridge's autoware_isaac_bridge). Paths
# are relative to this file.
#   rig   generated from ../vehicle/autosdv_car_a.yaml by aib.gen (just twin generate)
#   body  car A's look, made by ../body/make_body.py (just twin generate)
# No domain: the ego joins the starting terminal's ROS_DOMAIN_ID, which the twin's Autoware
# shares. Never leave it at a domain another stack uses (aib's own default ego pins 1).
rig: autosdv_car_a.rig.yaml
node_name: isaac_vehicle
body: body/vehicle.newslab.autosdv_car_a/entry.json
# The onboard computers' calibration, beyond what the spec gives (sim_vehicle_ecu.Calibration
# fields). brake_floor: a releasing brake below it is released; the road car's default, 50 N m,
# is more than car A's whole braking (~0.2 N m a wheel) and left it with no friction brakes.
# 0.005 N m a wheel is ~0.02 m/s^2 on 5 kg, the default's intent.
ecu:
  brake_floor: 0.005

# The overall speed limit of the car, in km/h: autosdv_speed_limit's node, which
# autosdv.launch.yaml starts unless use_speed_limit:=false (speed_limit_config:= points
# it at another file).
#
# Lab 3: start at 3. Raise it once the car laps reliably: edit this number and save; the stack
# applies it within a second, no restart. At most 10 (Lab 3's lanelet maximum); a value
# above 10 or not above 0 is refused and the previous limit kept.
#
# On each lanelet the car drives at no more than the lower of this limit and the
# lanelet's own speed_limit (set in Vector Map Builder).
max_speed_kmh: 3.0

# versions.yaml - Single source of truth for all AutoSDV versions
# This file is read by setup scripts, CI, and documentation generators.
#
# Read one value:   ./scripts/version/get-version.sh autosdv.version
# Export them all:  source ./scripts/version/export-versions.sh
#
# Every key here is consumed by export-versions.sh. Adding a key there without
# adding it here makes `source export-versions.sh` a silent no-op, which is how
# the nvidia/tools/checksums sections came to be documented but absent.

# =============================================================================
# AutoSDV Project Version
# =============================================================================
autosdv:
  version: "0.2.0"
  prerelease: "dev"       # "" on a release branch; "dev" on develop; "rc.N" on release/X.Y
  channel: "development"  # development | stable

# =============================================================================
# Autoware Base
#
# Installed from the autoware-localrepo Debian package, not from source. The
# filenames and checksums below are what setup/scripts/install-autoware-debian.sh
# downloads and verifies; keep the two in step.
# =============================================================================
autoware:
  version: "1.5.0"
  package_version: "1.5.0-2"
  rosdebian_release: "1.5.0-2"
  install_prefix: "/opt/autoware/1.5.0"
  localrepo_url_base: "https://github.com/NEWSLabNTU/autoware-localrepo/releases/download/1.5.0-2"
  deb_amd64: "autoware-localrepo-1-5-0_1.5.0-2ubuntu2204_all.deb"
  deb_jetpack62: "autoware-localrepo-1-5-0_1.5.0-2jetpack62_all.deb"

# =============================================================================
# ROS 2
# =============================================================================
ros:
  distro: "humble"
  installation_type: "desktop"  # desktop, ros-base
  rmw_implementation: "rmw_cyclonedds_cpp"

# =============================================================================
# NVIDIA platform
#
# NOT INSTALLED BY setup.sh. CUDA, cuDNN and TensorRT come from the host image:
# JetPack on a Jetson, and the distribution packages on an amd64 workstation.
# These values record what the Autoware Debian packages REQUIRE, not something
# this repository installs.
#
# The arm64 target is JetPack 6.2 -- the Debian package's own suffix is
# `jetpack62`. Documentation that still says "JetPack 6.0 exactly" predates it.
#
# The amd64 values are MAJOR versions, because that is what is actually
# required: they are the sonames Autoware's own shipped libraries link against,
# read off the installed tree rather than guessed --
#
#   ldd /opt/autoware/1.5.0/lib/libtensorrt_ops.so | grep nvinfer
#     libnvinfer.so.10          -> TensorRT 10.x
#   ldd /opt/autoware/1.5.0/lib/libautoware_lidar_centerpoint_cuda_lib.so
#     libcublas.so.12           -> CUDA 12.x
#
# Any patch version satisfying those sonames LOADS. The book previously told
# amd64 users to install TensorRT 8.6, which provides libnvinfer.so.8 and makes
# perception fail to load; that is the defect these values exist to prevent.
#
# Loading is not the whole story, though -- see tensorrt_engine_abi below.
#
# cuDNN is left empty because none of the Autoware CUDA libraries inspected
# link it directly.
# =============================================================================
nvidia_amd64:
  cuda: "12"
  cudnn: ""
  tensorrt: "10"

  # The EXACT TensorRT the Autoware amd64 Debians were compiled against, to the
  # patch. This is not the same requirement as `tensorrt` above, and it is not
  # pedantry:
  #
  # `autoware_tensorrt_common`'s TrtCommon::validateEngine() reads bytes 24-26
  # of an existing .engine (the plan's TensorRT version) and compares them
  # against the NV_TENSORRT_MAJOR/MINOR/PATCH macros baked into the shipped
  # library at ITS build time. Any difference, however small, is discarded as
  # "Validation failed for the existing engine file. Rebuilding" -- so a host
  # running a *different patch* of TensorRT 10 rebuilds all five perception
  # engines on every single launch and can never reuse a cached set.
  #
  # Measured on an RTX 3090 workstation whose loader resolved TensorRT 10.9.0
  # while these Debians were built against 10.8.0: every launch rebuilt
  # everything (~9 min), and `just build-engines` twice in a row rebuilt twice.
  # With 10.8.0 in front of it on LD_LIBRARY_PATH the same five engines load in
  # under 4 s. The Debian's own `Depends: libnvinfer10` cannot express this --
  # it is satisfied by 10.9 and by 10.16 alike.
  #
  # JetPack hides the problem on the vehicle: the Orin's TensorRT is the same
  # one the arm64 Debians were built against, so the versions agree by
  # construction. amd64 has no such guarantee, which is why
  # setup/scripts/install-tensorrt-runtime.sh exists and why scripts/env.sh
  # puts this version ahead of whatever else the host has.
  #
  # Re-read it after an Autoware upgrade -- from a build log's own
  # "Current version: X.Y.Z" line, which is the library speaking, not a guess:
  #
  #   ros2 launch autoware_lidar_centerpoint lidar_centerpoint.launch.xml \
  #     build_only:=true model_name:=centerpoint_tiny 2>&1 | grep "Current version"
  tensorrt_engine_abi: "10.8.0"

nvidia_arm64:
  jetpack: "6.2"
  l4t: ""
  cuda: ""
  cudnn: ""
  tensorrt: ""

# =============================================================================
# ZED camera
#
# The SDK and the ROS 2 wrapper are ONE version, not two. `zed_components`
# compiles against the installed SDK's headers, so a wrapper built for 5.1 and
# an SDK at 5.4 is a build or a runtime failure rather than a degraded mode.
# Bump both together, or neither.
#
# NOT INSTALLED BY setup.sh, and not for the usual reason: Stereolabs publishes
# no apt repository at all. The only official artifact is a self-extracting
# `.run` installer that prompts, so the `zed-sdk` step checks for the SDK and
# prints the exact download for this machine instead of pretending to install
# it. See setup/scripts/install-zed-sdk.sh.
#
# `url_base` + the platform path is the STABLE redirect Stereolabs maintains
# (e.g. .../5.4/cu12/ubuntu22), which resolves to a CDN file whose name carries
# the patch version. Prefer the redirect: the CDN filename changes with every
# patch release, the redirect does not.
#
# Worth knowing, because it caused a day's confusion here: the amd64 installer
# is ZED_SDK_Ubuntu22_cuda12.8_tensorrt10.9_v5.4.1 -- it brings TensorRT 10.9,
# while Autoware's engines require 10.8 exactly
# (nvidia_amd64.tensorrt_engine_abi above). The two coexist because
# scripts/trt-runtime-env.sh puts Autoware's TensorRT in front for AutoSDV
# processes only, which is also why the `tensorrt-runtime` step installs into a
# private prefix rather than downgrading the system libraries the ZED SDK needs.
# =============================================================================
zed:
  sdk_version: "5.4.1"
  sdk_series: "5.4"          # the URL path component; patch lives in the CDN filename
  url_base: "https://download.stereolabs.com/zedsdk"
  wrapper_branch: "ntust-workshop"   # our fork's patch series, rebased onto:
  wrapper_upstream_tag: "v5.4.1"

# =============================================================================
# Container images
# =============================================================================
# The desktop (workshop) image builds FROM an NVIDIA CUDA image rather than
# plain Ubuntu, because setup.sh deliberately does not install CUDA or TensorRT
# -- on the vehicle they come from JetPack, on a workstation from the host image
# -- and the Autoware debs then refuse to resolve:
#
#   ros-humble-autoware-tensorrt-common-1-5-0 : Depends: libnvinfer10
#                                                        but it is not installable
#
# Pinned HERE, and passed to the Dockerfile as a build arg, so the FROM line
# does not become a second copy of the version. `install-autoware-debian.sh`
# keeping its own copy of the Autoware version is exactly how that drifts.
#
# 12.8 is the CUDA version upstream Autoware selects for humble, so this keeps
# the container aligned with what Autoware itself targets. `devel` rather than
# `runtime` because the workspace is BUILT in the image and cuda_ffi/build.rs
# panics without nvcc and the CUB headers. The `-cudnn-` variant carries cuDNN;
# nothing in Autoware was observed to link it directly, but having it in the
# base costs a layer rather than an install step.
#
# Published for linux/amd64 AND linux/arm64, which is what lets one Dockerfile
# serve Apple Silicon natively.
# The two architectures are NOT the same image with a different arch. They are
# two different platforms that happen to share a Dockerfile:
#
#   amd64  a workstation/laptop build. CUDA and TensorRT come from NVIDIA's
#          x86 packages, so an NVIDIA CUDA image is the right base.
#
#   arm64  a JETSON-flavoured build that runs on Apple Silicon. Autoware comes
#          from the jetpack62 localrepo (install-autoware-debian.sh already
#          selects it on aarch64), and CUDA/TensorRT come from the Jetson apt
#          repository. It works off a Jetson because JetPack 6.2 is Ubuntu
#          22.04 underneath and Apple Silicon is arm64.
#
#          NOT nvidia/cuda's arm64 tag: that is built for SBSA, the server-ARM
#          platform, and pairing SBSA CUDA with JetPack Autoware packages mixes
#          two platforms. Plain Ubuntu plus the Jetson repository keeps the
#          image on one.
container:
  desktop_base_amd64: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04"
  desktop_base_arm64: "ubuntu:22.04"

# =============================================================================
# Tool versions
# =============================================================================
tools:
  pre_commit_clang_format: ""

# =============================================================================
# Package checksums (SHA256)
#
# Mirrors setup/scripts/install-autoware-debian.sh.
# =============================================================================
checksums:
  autoware_deb_amd64: "f8e2d1d2f43d7a7186b7fbcd391b473783d1ef9cd131a12bfea898255d450acb"
  autoware_deb_jetpack62: "e3187ca5a7e175aaabd239b5056d7ec1fb6eba92f6c232f8be67ee9958a6a064"
  autoware_deb_arm64: "e3187ca5a7e175aaabd239b5056d7ec1fb6eba92f6c232f8be67ee9958a6a064"
  autoware_deb_jetpack60: ""

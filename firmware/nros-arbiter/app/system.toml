# nano-ros system description: one component, one image.
[system]
name = "autosdv_arbiter"
rmw = "zenoh"
domain_id = 0
default_images = ["arbiter"]

[[component]]
pkg = "autosdv_arbiter"
class = "autosdv_arbiter::ArbiterNode"
name = "arbiter"

[image.arbiter]
board = "xiao-rp2350"
rmw = "zenoh"
os_config = ["prj-link.conf"]
# The first CDC-ACM port (app.overlay). The Orin end is a zenoh router with a
# serial listener on the board's /dev/ttyACM* device.
locator = "serial/cdc_acm_uart0#baudrate=115200"

# The node subscribes to nothing, so the large-payload receive pool (128 KiB
# by default) is dead weight on a 520 KiB part. nano-ros currently derives it
# from the linked message types rather than the subscriptions.
[image.arbiter.knobs.zenoh]
max_large_subscribers = 0

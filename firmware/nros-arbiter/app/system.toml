# nano-ros system description: one component, two images (the car, and its
# QEMU stand-in).
[system]
name = "autosdv_arbiter"
rmw = "zenoh"
domain_id = 0
default_images = ["arbiter"]

[[component]]
pkg = "autosdv_arbiter"
class = "autosdv_arbiter::ArbiterNode"
name = "arbiter"
# What the node creates (ArbiterNode.cpp). Declaring it lets nano-ros size the
# executor and the zenoh receive pools from these entities: one publisher, no
# subscriptions, so no large-payload receive pool. Undeclared, the image
# budgets the worst case and does not fit the board's 520 KiB of RAM.
entities = [
    "publisher:std_msgs/msg/String:/vehicle/arbiter/mode",
    "timer",
]

[image.arbiter]
board = "xiao-rp2350"
rmw = "zenoh"
os_config = ["prj-link.conf", "prj-xiao.conf"]
# The first CDC-ACM port (boards/xiao_rp2350_rp2350a_m33.overlay). The Orin
# end is a zenoh router with a serial listener on the board's /dev/ttyACM*.
locator = "serial/cdc_acm_uart0#baudrate=115200"

# QEMU mps2-an521 (Cortex-M33), the car's image with its hardware simulated
# (src/sim/board_sim.cpp): `just arbiter nros-qemu`. Zephyr names a UART
# device by its devicetree node, so uart1 is "uart@201000".
[image.arbiter_qemu]
board = "mps2-an521"
rmw = "zenoh"
os_config = ["prj-link.conf"]
locator = "serial/uart@201000#baudrate=115200"


# Application Kconfig for the arbiter. The board's base fragment
# (boards/nros-board-xiao-rp2350/prj.conf) is layered ahead of this file, and
# prj-link.conf, the zenoh link, after it.

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NROS=y

# Hardware the arbiter drives.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_WATCHDOG=y
CONFIG_LED_STRIP=y

# A 1 ms tick, so the arbiter's 1 kHz timer lands on a tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Mode changes are logged to the console (the second CDC-ACM port).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

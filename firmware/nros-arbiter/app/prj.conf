# Application Kconfig for the arbiter, on every board. The board's base
# fragment (boards/nros-board-*/prj.conf) is layered ahead of this file, and
# the image's os_config fragments (system.toml) after it.

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NROS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# A 1 ms tick, so the arbiter's 1 kHz timer lands on a tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Mode changes are logged to the console.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# The zenoh link to the Orin: zenoh-pico's built-in COBS serial framing over
# USB CDC-ACM, with no IP stack.
CONFIG_NETWORKING=n
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_RING_BUFFER=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Below the arbiter's control thread, which is cooperative and must never wait
# on zenoh.
CONFIG_MAIN_THREAD_PRIORITY=5

# USB device stack with the CDC-ACM ports app.overlay declares.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

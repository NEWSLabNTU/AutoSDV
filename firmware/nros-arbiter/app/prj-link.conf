# The zenoh link to the Orin: zenoh-pico's built-in COBS serial framing over a
# UART device, with no IP stack. Which device is the image's locator.
CONFIG_NETWORKING=n
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_RING_BUFFER=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Below the arbiter's control thread, which is cooperative and must never wait
# on zenoh.
CONFIG_MAIN_THREAD_PRIORITY=5

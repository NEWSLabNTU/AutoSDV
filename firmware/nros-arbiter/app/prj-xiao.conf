# The car's XIAO RP2350: the hardware the arbiter drives, and the USB device
# stack with the two CDC-ACM ports boards/xiao_rp2350_rp2350a_m33.overlay
# declares (zenoh on the first, the log on the second).
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y
CONFIG_LED_STRIP=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

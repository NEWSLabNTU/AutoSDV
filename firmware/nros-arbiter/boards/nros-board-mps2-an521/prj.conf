# Base Kconfig of board mps2-an521, layered ahead of the application's own
# fragments by nano-ros. Kept close to xiao-rp2350's so the emulator runs the
# configuration the car does.

# QEMU's AN521 has no entropy source; this generator's seed is a constant, so
# every run picks the same zenoh session id. Fine for one board in an
# emulator, never for a real one.
CONFIG_TEST_RANDOM_GENERATOR=y

# No CONFIG_FPU: Zephyr's AN521 cpu0 SoC does not declare an FPU (only cpu1
# does), so the line would be dropped. Floating point is soft here, hard on
# the XIAO; the arbiter's float math is the same either way.

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y

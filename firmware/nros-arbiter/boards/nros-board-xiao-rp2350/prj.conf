# Base Kconfig of board xiao-rp2350, layered ahead of the application's own
# fragments by nano-ros.

# The RP2350 TRNG (rng@400f0000, chosen as zephyr,entropy) backs
# sys_rand_get(), so zenoh session ids differ between boards. Do not use
# TEST_RANDOM_GENERATOR here: its seed is a constant.
CONFIG_ENTROPY_GENERATOR=y

# Cortex-M33 single-precision FPU; the arbiter's throttle maps use float.
CONFIG_FPU=y

# 520 KB SRAM for zenoh-pico, nano-ros and the application.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536

# A stack overflow faults with a name instead of corrupting a neighbour.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
